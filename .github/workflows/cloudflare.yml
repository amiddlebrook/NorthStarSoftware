name: Deploy NorthStar portfolio to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: northstar-portfolio-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Sync catalog, build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Fetch every public amiddlebrook repository
        run: npm run sync:repos
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Resolve verified live Workers URLs and repository media
        run: node scripts/resolve-previews.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install headless browser for actual app screenshots
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Capture live application thumbnails
        run: node scripts/build-previews.mjs
      - name: Build production site
        run: npm run build
      - name: Deploy Worker static assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
